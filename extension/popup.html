<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncWatch</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f14;
      color: #e8e8f0;
      width: 320px;
      padding: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .logo h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 4px;
      margin-top: 12px;
    }

    input, select {
      width: 100%;
      padding: 8px 10px;
      background: #1c1c26;
      border: 1px solid #2e2e40;
      border-radius: 6px;
      color: #e8e8f0;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: #7c3aed;
    }

    select option {
      background: #1c1c26;
    }

    .role-note {
      font-size: 10px;
      color: #666;
      margin-top: 4px;
      line-height: 1.4;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 9px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.88; }

    #status {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      min-height: 16px;
      transition: color 0.2s;
    }

    #status.ok  { color: #4ade80; }
    #status.err { color: #f87171; }

    .divider {
      border: none;
      border-top: 1px solid #2e2e40;
      margin: 14px 0 0;
    }

    .conn-panel {
      margin-top: 12px;
      padding: 10px 12px;
      background: #1c1c26;
      border-radius: 8px;
      border: 1px solid #2e2e40;
    }

    .conn-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.green  { background: #4ade80; }
    .dot.gray   { background: #555; }
    .dot.red    { background: #dc2626; }
    .dot.yellow { background: #f59e0b; }

    .conn-detail {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
      margin-left: 16px;
    }

    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 6px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #2e2e40;
      background: #1c1c26;
      color: #888;
      transition: border-color 0.2s, color 0.2s;
    }

    .action-btn.danger:hover { border-color: #dc2626; color: #f87171; }

    .share-btn {
      margin-top: 12px;
      padding: 8px;
      background: #1c1c26;
      border: 1px solid #2e2e40;
      border-radius: 6px;
      color: #a78bfa;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .share-btn:hover { border-color: #7c3aed; }
    .share-btn.copied { border-color: #4ade80; color: #4ade80; }

    .hint {
      font-size: 10px;
      color: #555;
      margin-top: 10px;
      line-height: 1.5;
    }

    .previous-rooms-list {
      max-height: 380px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 4px;
      padding-right: 4px;
    }

    .previous-rooms-list::-webkit-scrollbar {
      width: 4px;
    }
    .previous-rooms-list::-webkit-scrollbar-track {
      background: #0f0f14;
    }
    .previous-rooms-list::-webkit-scrollbar-thumb {
      background: #2e2e40;
      border-radius: 2px;
    }
    .previous-rooms-list::-webkit-scrollbar-thumb:hover {
      background: #7c3aed;
    }

    .room-card {
      background: #1c1c26;
      border: 1px solid #2e2e40;
      border-radius: 6px;
      padding: 0;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      overflow: hidden;
    }

    .room-card:hover {
      border-color: #7c3aed;
    }

    .room-card-header {
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .room-card-header:hover {
      background: #232332;
    }

    .room-card-details {
      display: none;
      padding: 10px;
      border-top: 1px solid #2e2e40;
      background: #15151e;
      cursor: default;
    }

    .room-card.expanded .room-card-details {
      display: block;
    }

    .room-card-info {
      flex: 1;
      min-width: 0;
      margin-right: 8px;
    }

    .room-card-title {
      font-size: 12px;
      font-weight: 600;
      color: #e8e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .room-card-subtitle {
      font-size: 10px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .room-card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .history-title {
      font-size: 9px;
      font-weight: 700;
      color: #7c3aed;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .movie-card {
      background: #1c1c26;
      border: 1px solid #2e2e40;
      border-radius: 4px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .movie-card:hover {
      border-color: #a855f7;
      background: #232332;
    }

    .movie-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
    }

    .movie-title {
      font-size: 11px;
      font-weight: 600;
      color: #e8e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .movie-link-btn {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      padding: 4px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background 0.2s;
      text-decoration: none;
      flex-shrink: 0;
    }

    .movie-link-btn:hover {
      color: #a855f7;
      background: rgba(168, 85, 247, 0.1);
    }

    .movie-link-btn svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .movie-card-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .movie-delete-btn {
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      padding: 4px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
      margin-top: 0;
      width: auto;
    }

    .movie-delete-btn:hover {
      color: #f87171;
      background: rgba(248, 113, 113, 0.1);
    }

    .movie-delete-btn svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }


    .movie-card-details {
      display: none;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed #2e2e40;
      text-align: center;
      font-size: 10px;
      color: #f472b6;
      font-weight: 600;
      width: 100%;
    }

    .movie-card.expanded .movie-card-details {
      display: block;
    }

    .no-history {
      font-size: 10px;
      color: #666;
      text-align: center;
      padding: 6px 0;
    }

    .badge {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.4px;
    }

    .badge.controller {
      background: rgba(124, 58, 237, 0.2);
      color: #a78bfa;
      border: 1px solid rgba(124, 58, 237, 0.4);
    }

    .badge.receiver {
      background: rgba(14, 165, 233, 0.2);
      color: #38bdf8;
      border: 1px solid rgba(14, 165, 233, 0.4);
    }

    .room-delete-btn {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      padding: 4px;
      margin-top: 0;
      width: auto;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background 0.2s;
    }

    .room-delete-btn:hover {
      color: #f87171;
      background: rgba(248, 113, 113, 0.1);
    }

    .room-delete-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    .no-rooms {
      font-size: 11px;
      color: #555;
      text-align: center;
      padding: 12px 0;
      border: 1px dashed #2e2e40;
      border-radius: 6px;
    }

    .new-room-card {
      background: #1c1c26;
      border: 1px solid #2e2e40;
      border-radius: 6px;
      margin-bottom: 12px;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .new-room-card:hover {
      border-color: #7c3aed;
    }

    .new-room-header {
      padding: 10px 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      color: #a78bfa;
      background: rgba(124, 58, 237, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s;
    }

    .new-room-header:hover {
      background: rgba(124, 58, 237, 0.1);
    }

    .new-room-form {
      display: none;
      padding: 12px;
      border-top: 1px solid #2e2e40;
    }

    .new-room-card.expanded .new-room-form {
      display: block;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      margin-top: 6px;
      border-top: 1px dashed #2e2e40;
    }

    .top-toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      margin: -8px -8px 8px -8px;
      background: #14141c;
      border-radius: 8px;
      border: 1px solid #2e2e40;
    }

    .toggle-label {
      font-size: 11px;
      font-weight: 600;
      color: #888;
    }

    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #2e2e40;
      border-radius: 22px;
      transition: background 0.2s;
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background: #888;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }

    .toggle-switch input:checked + .toggle-slider {
      background: rgba(124, 58, 237, 0.4);
    }

    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(18px);
      background: #a78bfa;
    }
  </style>
</head>
<body>
  <div class="top-toggle-row">
    <span class="toggle-label" id="toggleLabel">Paused</span>
    <label class="toggle-switch">
      <input type="checkbox" id="syncToggle" />
      <span class="toggle-slider"></span>
    </label>
  </div>

  <div class="logo">
    <div class="logo-icon">▶</div>
    <h1>SyncWatch</h1>
  </div>

  <div class="new-room-card" id="newRoomCard">
    <div class="new-room-header" id="newRoomHeader">
      <span class="new-room-title">＋ New Room</span>
    </div>
    <div class="new-room-form" id="newRoomForm">
      <label style="margin-top: 0;">Server URL</label>
      <input id="serverUrl" type="text" placeholder="ws://your-server:3000" />

      <label>Room ID</label>
      <input id="roomId" type="text" placeholder="e.g. movie-night-2024" />

      <label>My Role</label>
      <select id="role">
        <option value="controller">Controller (Mac — I control playback)</option>
        <option value="receiver">Receiver (iPad — I follow along)</option>
      </select>
      <p class="role-note">Set to <strong>Controller</strong> on your Mac. Set to <strong>Receiver</strong> on your friend's iPad.</p>

      <button id="saveBtn">Save &amp; Connect</button>
      <div id="status"></div>
    </div>
  </div>

  <div id="connPanel" class="conn-panel" style="display:none">
    <div class="conn-row">
      <span id="connDot" class="dot"></span>
      <span id="connText">Disconnected</span>
    </div>
    <div class="conn-detail" id="connRoom"></div>
    <div class="conn-detail" id="connClients"></div>
    <div class="action-row" id="actionRow">
      <button id="resetBtn" class="action-btn danger">Reset Room</button>
      <button id="kickBtn" class="action-btn danger">Kick All</button>
    </div>
  </div>

  <button id="shareBtn" class="share-btn">Share Invite</button>
  <button id="shareSetupBtn" class="share-btn" style="margin-top: 8px;">Share Setup Link</button>

  <div style="margin-top: 14px;">
    <label style="margin-top: 0; margin-bottom: 6px;">Previous Rooms</label>
    <div id="previousRoomsList" class="previous-rooms-list"></div>
  </div>

  <div class="backup-row" style="display: flex; gap: 8px; margin-top: 12px;">
    <button id="exportBtn" class="action-btn" style="flex: 1; margin-top: 0; padding: 6px;">Export JSON</button>
    <button id="importBtn" class="action-btn" style="flex: 1; margin-top: 0; padding: 6px;">Import JSON</button>
    <input id="importFile" type="file" accept=".json" style="display: none;" />
  </div>

  <hr class="divider" />
  <p class="hint">Changes apply automatically — no need to reload the tab.</p>

  <script src="popup.js"></script>
</body>
</html>
